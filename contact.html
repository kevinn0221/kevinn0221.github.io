<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- Core Variables --- */
        :root {
            --bg-color: #0b0c10;
            --text-main: #ffffff;
            --text-muted: #a0aab2;
            --accent-color: #00a8ff;
            --card-bg: #151821;
            --glow-color: rgba(0, 168, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Navigation Bar --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px 20px 0;
            background: rgba(11, 12, 16, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span.kd {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 1.5rem;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-color);
        }

        /* Mobile Menu Button */
        .menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            padding-right: 20px;
        }

        /* --- Contact Section --- */
        .contact-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            animation: fadeIn 0.8s ease-out forwards;
            background: radial-gradient(circle at center, rgba(0, 168, 255, 0.05) 0%, var(--bg-color) 60%);
        }

        .contact-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .contact-header h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .contact-header p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Social Icons */
        .social-links {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            font-size: 1.5rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        /* The glowing effect on hover */
        .social-icon:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--glow-color), inset 0 0 10px var(--glow-color);
            transform: translateY(-3px);
        }

        /* Form Container */
        .contact-form {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Form Inputs */
        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 168, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }

        /* Submit Button */
        .btn-submit {
            background: linear-gradient(90deg, #007bb5, #00a8ff);
            color: #ffffff;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            box-shadow: 0 8px 25px rgba(0, 168, 255, 0.4);
            transform: translateY(-2px);
        }

        /* --- Footer --- */
        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 50px;
            background: #08090c;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: auto;
        }

        footer .copyright {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 900px) {
            nav {
                padding: 15px 0 15px 0;
            }
            .menu-btn {
                display: block;
            }
            .nav-links {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: rgba(11, 12, 16, 0.95);
                backdrop-filter: blur(10px);
                padding: 20px;
                gap: 15px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                transform: translateY(-150%);
                transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
                opacity: 0;
                pointer-events: none;
            }
            .nav-links.active {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }
            .contact-header h1 { font-size: 2rem; }
            .social-links { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <span class="kd">DK</span>
            <div class="logo-text">
                <span>Dhamecha Kevin</span>
            </div>
        </div>

        <button class="menu-btn" id="menuBtn" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
        </button>

        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="resume.html">Resume</a></li>
            <li><a href="about.html">About me</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <section class="contact-section">
        <div class="contact-header">
            <h1>Let's Connect & Collaborate 💙</h1>
            <p>Whether it's a new project, a collaboration, or just to say hi — I'd love to hear from you!</p>
        </div>

        <div class="social-links">
            <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-github"></i></a>
            <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="mailto:your.email@example.com" class="social-icon"><i class="fa-regular fa-envelope"></i></a>
            <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-facebook-f"></i></a>
        </div>

        <form class="contact-form" action="https://formspree.io/f/xreoyaol" method="POST">
            <input type="text" name="name" class="form-control" placeholder="Your Name" required>
            <input type="text" name="subject" class="form-control" placeholder="Subject" required>
            <textarea name="message" class="form-control" placeholder="Your Message..." required></textarea>
            
            <button type="submit" class="btn-submit">
                🚀 Send Message
            </button>
        </form>
    </section>

    <footer>
        <div class="copyright">
            <i class="fa-regular fa-copyright"></i>
            <span>2026 Dhamecha Kevin — Built with HTML/CSS</span>
        </div>
    </footer>

    <script>
        /* Mobile Navigation Menu Toggle */
        const menuBtn = document.getElementById('menuBtn');
        const navLinks = document.getElementById('navLinks');
        const menuIcon = menuBtn.querySelector('i');

        menuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            if (navLinks.classList.contains('active')) {
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-xmark');
            } else {
                menuIcon.classList.remove('fa-xmark');
                menuIcon.classList.add('fa-bars');
            }
        });
    </script>

</body>
</html>
