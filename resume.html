<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- Core Variables --- */
        :root {
            --bg-color: #0b0c10;
            --text-main: #ffffff;
            --text-muted: #a0aab2;
            --accent-color: #00a8ff;
            --card-bg: #151821;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Navigation Bar --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(11, 12, 16, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span.kd {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 1.5rem;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-color);
        }

        /* --- Resume Section --- */
        .resume-section {
            flex: 1;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .resume-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .resume-header h1 {
            font-size: 2rem;
            color: var(--text-main);
        }

        /* The PDF Viewer Container */
        .pdf-container {
            width: 100%;
            max-width: 1000px; /* Limits how wide the resume gets on big screens */
            height: 80vh;      /* Takes up 80% of the screen height */
            background-color: #323639; /* Standard Chrome PDF viewer background color */
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Download Button */
        .btn-download {
            background-color: var(--accent-color);
            color: #000;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 168, 255, 0.3);
        }

        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 168, 255, 0.5);
            background-color: #33b5ff;
        }

        /* --- Footer --- */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: #08090c;
            border-top: 1px solid rgba(255,255,255,0.05);
            width: 100%;
        }

        footer .copyright {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            nav, .resume-section { padding: 20px; }
            .pdf-container { height: 60vh; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <span class="kd">DK</span>
            <div class="logo-text">
                <span>Dhamecha Kevin</span>
                <span>Web Developer | Python app Developer</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="resume.html" class="active">Resume</a></li>
            <li><a href="#">About me</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <section class="resume-section">
        
        <div class="resume-header">
            <h1>My Resume</h1>
        </div>

        <div class="pdf-container">
            <iframe src="Resume_Kevin Dhamecha.pdf" title="Resume">
                This browser does not support PDFs. Please download the PDF to view it.
            </iframe>
        </div>

        <a href="Resume_Kevin Dhamecha.pdf" download="Dhamecha_Kevin_Resume.pdf" class="btn-download">
            <i class="fa-solid fa-download"></i> Download Full Resume
        </a>

    </section>

    <footer>
        <div class="copyright">
            <i class="fa-regular fa-copyright"></i>
            <span>Dhamecha Kevin</span>
        </div>
    </footer>

</body>
</html>
